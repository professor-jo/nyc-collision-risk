
name: Python and CDK CI

# Automatically starts the wrokflow on pushes or PRs;
# Also allows manual runs
on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only access to repository contents
permissions:
  contents: read

jobs:
  tests:
    name: Run Python and infrastructure tests
    # Creates a temporary Linux environment to execute tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      PYTHONPATH: "infra:."

    steps:
      # Step 1: Download repository code on that environment
      - name: Check out repository
        uses: actions/checkout@v7

      # Step 2: Install Python 3.12
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Step 3: Install dependencies, packages required to run
      # the code and tests
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-lambda.txt \
            -r infra/requirements.txt \
            -r infra/requirements-dev.txt \
            boto3

      # Step 4: Build the Lambda package my CDK tests require
      - name: Build Lambda deployment package
        run: bash scripts/build_lambda_package.sh

      # Step 5: Check Python syntax
      - name: Check Python syntax (including Glue ETL)
        run: python -m compileall -q ingestion glue infra

      # Step 6: Run automated tests that I've already made.
      - name: Run ingestion and CDK infrastructure tests
        run: python -m pytest -q tests/ infra/tests/unit/
